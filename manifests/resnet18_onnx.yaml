name: ResNet18
version: 1.0.0
task: classification
framework:
  name: onnx
inputs:
  - type: image
    shape: [batch_size, 3, 224, 224]
    element_type: float32
outputs:
  - type: logits
    shape: [batch_size, 1000]
    element_type: float32
preprocessing:
  enabled: false
post_processing:
  enabled: false
profiling:
  batch_size: 1
runtime:
  name: onnxruntime
source:
  type: local
  path: resnet18_clean.onnx
